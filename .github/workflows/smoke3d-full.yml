# The FULL 3D test suite: every feature's scripts/tests3d/*.js (journey, law,
# garage, parking, multiplayer, roadevents, cameos, foot, interiors, dina, meta…).
# It plays each feature through with a fake controller in software WebGL, which
# is slow (one machine: a couple of hours), so it runs on demand (Actions →
# "3D full suite" → Run workflow) — SPLIT ACROSS MACHINES that run at the same
# time: one test file per machine (up to 16), so the whole thing takes about as
# long as the slowest file (~45 min) instead of the sum.
#   only   — which test files (comma list, e.g. law,journey). Empty = all.
#   groups — run exactly these groups in parallel, separated by ';'
#            (e.g. "community;midwood;core,rides"). Overrides `only`. `node scripts/affected.js` prints a ready one
#            for your change (packed by the recorded durations in scripts/tests3d-durations.json).
#   clock  — "" / "fast" (the fast test clock, except the files that say `fast: false`) or "slow" (the old clock
#            everywhere, e.g. to compare) — see scripts/smoke3d.js › THE FAST TEST CLOCK.
# Without `groups`, the files are packed onto ≤ 16 machines by their recorded durations (longest first).
# Works on any branch (pick it in "Use workflow from"): push a test branch and
# run it there before merging to main.
name: 3D full suite

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma list of test files (e.g. law,journey). Empty = all."
        required: false
        default: ""
      groups:
        description: "Optional: exact parallel groups separated by ';' (e.g. community;midwood;core,rides). Overrides 'only'."
        required: false
        default: ""
      clock:
        description: "Test clock: empty / fast = the fast test clock (default) · slow = the old clock everywhere"
        required: false
        default: ""

# ONE run per branch: starting a new run on a branch cancels that branch's older run, so a superseded run never
# keeps machines busy (they are shared by every agent — jobs were waiting 15–50 min for one). Put everything you
# need into ONE dispatch (`only` / `groups`) instead of starting two side by side.
concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          GROUPS: ${{ inputs.groups }}
        run: |
          node -e '
            const fs = require("fs");
            const MAX = 16;
            const split = (s, sep) => (s || "").split(sep).map(x => x.trim()).filter(Boolean);
            let groups = split(process.env.GROUPS, ";");
            if (!groups.length) {
              const all = fs.readdirSync("scripts/tests3d").filter(f => f.endsWith(".js")).map(f => f.slice(0, -3)).sort();
              const files = split(process.env.ONLY, ",").length ? split(process.env.ONLY, ",") : all;
              // pack by the recorded durations (longest first onto the least-loaded machine)
              let dur = {};
              try { dur = JSON.parse(fs.readFileSync("scripts/tests3d-durations.json", "utf8")).files || {}; } catch (e) { }
              const sec = f => (dur[f] && dur[f].fast) || (dur[f] && dur[f].slow) || 300;
              const n = Math.min(MAX, files.length);
              const bins = Array.from({ length: n }, () => ({ t: 0, f: [] }));
              for (const f of [...files].sort((a, b) => sec(b) - sec(a))) { const b = bins.reduce((m, x) => x.t < m.t ? x : m); b.t += sec(f); b.f.push(f); }
              groups = bins.filter(b => b.f.length).map(b => b.f.join(","));
            }
            console.log("groups:", groups);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "groups=" + JSON.stringify(groups) + "\n");
          '

  smoke3d:
    needs: plan
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150     # (the slowest file, calm, takes ~85 min; a hung job must not hold a machine for 5 hours)
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Play ${{ matrix.group }}
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          SMOKE3D_ONLY: ${{ matrix.group }}
          SMOKE3D_FAST: ${{ inputs.clock == 'fast' && '1' || inputs.clock == 'slow' && '0' || '' }}
          SMOKE3D_TIMES: smoke-times/times-${{ strategy.job-index }}.json
          SMOKE3D_PROF: "1"        # (a PROF line per file: boot / draws / game step — where the time goes)
        run: node scripts/smoke3d.js --shots

      - name: Timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: times-${{ strategy.job-index }}
          path: smoke-times/
          if-no-files-found: ignore
          retention-days: 30

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ strategy.job-index }}
          path: smoke-shots/
          if-no-files-found: ignore
          retention-days: 7
