# Codemagic CI/CD — native iOS build for Lulu's Road Trip (Capacitor wrapper).
#
# This is a NEW, self-contained workflow for the Capacitor app. It does not
# touch any other app/workflow you have in Codemagic. Before the first build:
#   1. In Codemagic → Teams → Integrations, connect an App Store Connect API
#      key, and note its "name" (referenced below as Jogley).
#   2. In App Store Connect, create a NEW app with a UNIQUE bundle id (the
#      `bundle_identifier` below) — must differ from your existing app.
#   3. Add an iOS distribution certificate + provisioning profile to the
#      Codemagic code-signing settings (or let Codemagic manage signing).
# See IOS_BUILD.md for the full walkthrough.

workflows:
  ios-capacitor:
    name: Lulu's Road Trip — iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Auto-start a build whenever main is pushed. Requires the Codemagic
    # webhook to be connected for this app (Codemagic → app → check the
    # repository/webhook is linked). Remove this block to go back to building
    # only when you click "Start new build".
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    integrations:
      app_store_connect: Jogley   # <- your integration name (key J42D8594FA)
    environment:
      # NOTE: we deliberately do NOT use the `ios_signing` block here.
      # That block makes Codemagic run its built-in automatic signing at
      # build-init time, which only *fetches* an existing profile and fails
      # immediately ("No matching profiles found") before any script runs.
      # Instead we fetch-and-CREATE the cert + profile ourselves in the
      # "Set up code signing" script step below.
      groups:
        # Codemagic env-var group that must contain CERTIFICATE_PRIVATE_KEY
        # (a 2048-bit RSA private key). fetch-signing-files uses it to create
        # and reuse the iOS distribution certificate. Without it, the tool
        # cannot generate a certificate and silently produces no signing files.
        - ios_signing
      vars:
        BUNDLE_ID: "boats.lulu.game"
        # Capacitor 8 uses Swift Package Manager, not CocoaPods, so there is
        # no .xcworkspace / Podfile — we build the Xcode project directly and
        # Xcode resolves the SPM packages (incl. the AdMob plugin) on its own.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web bundle + stage www/
        script: |
          node build.js
          node scripts/copy-web.js
      - name: Generate the iOS native project (Capacitor)
        script: |
          # Regenerated each build so nothing native needs to live in git.
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Generate app icon + splash screen
        script: |
          # Rasterizes assets/icon.png + assets/splash.png into the iOS
          # AppIcon set and launch screen so the app ships a real icon instead
          # of the default Capacitor one. ios/ is regenerated each build, so we
          # (re)generate the assets here every time.
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#1a1a2e' \
            --iconBackgroundColorDark '#1a1a2e' \
            --splashBackgroundColor '#1a1a2e' \
            --splashBackgroundColorDark '#1a1a2e'
      - name: Inject AdMob App ID into Info.plist
        script: |
          # AdMob requires GADApplicationIdentifier in the native Info.plist.
          # Because ios/ is regenerated each build, we set it here every time.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Add :GADApplicationIdentifier string ca-app-pub-1477782549591980~6348467252" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :GADApplicationIdentifier ca-app-pub-1477782549591980~6348467252" \
            "$PLIST"
          # App Tracking Transparency prompt text (required if the SDK can read IDFA).
          /usr/libexec/PlistBuddy -c \
            "Add :NSUserTrackingUsageDescription string This lets us show more relevant ads to keep the game free." \
            "$PLIST" 2>/dev/null || true
          # Hide the iOS status bar so the game runs truly full-screen (no clock
          # band over the artwork). Both keys are required for it to stick.
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST"
      - name: Set marketing + build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Set up code signing
        script: |
          # Fetch (and CREATE if missing) the distribution certificate +
          # provisioning profile for this bundle id, using the Jogley
          # App Store Connect key. The --create flag is what generates a
          # brand-new profile for boats.lulu.game on first run.
          keychain initialize
          # --certificate-key supplies the RSA private key the tool needs to
          # create (and on later builds, reuse) the iOS distribution cert.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create \
            --verbose
          keychain add-certificates
          # --verbose prints which profile/cert got matched to which target;
          # --warn-only is intentionally NOT set so a no-match fails loudly.
          xcode-project use-profiles --verbose
      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true once you've set up TestFlight beta groups / review.
        submit_to_app_store: false
