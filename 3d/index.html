<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7fc8f8">
    <meta name="description" content="Lulu's Road Trip in 3D: drive Lulu's pink convertible to Bubbe's house. Works with a game controller, keyboard or touch.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta property="og:title" content="Lulu's Road Trip 2.0">
    <meta property="og:description" content="Grab a controller and drive Lulu to Bubbe's house!">
    <meta property="og:url" content="https://lulu.boats/3d/">
    <title>Lulu's Road Trip 2.0</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='25' y='15' width='50' height='75' rx='12' fill='%23E91E63'/%3E%3Crect x='30' y='25' width='40' height='25' rx='6' fill='%2381D4FA'/%3E%3Ccircle cx='35' cy='38' r='3' fill='%23222'/%3E%3Ccircle cx='65' cy='38' r='3' fill='%23222'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Fredoka from Google Fonts, loaded WITHOUT blocking the first paint (offline / a slow
         network in the iOS app must never hold up the loading screen); until it arrives, or
         when there's no network, --font falls back to SF Rounded (ui-rounded) / Arial Rounded. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style3d.css">
    <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.min.js",
                   "three/addons/": "./vendor/three/examples/jsm/" } }
    </script>
</head>
<body>
<div id="otaMarker" style="position:fixed;left:50%;top:12%;transform:translateX(-50%);z-index:2147483647;background:#000;color:#fff;font:bold 28px sans-serif;padding:6px 12px;pointer-events:none">OTA COPY C</div>
    <canvas id="scene"></canvas>

    <!-- ── driving HUD ─────────────────────────────────────── -->
    <div id="hud" class="hidden">
        <div class="hud-tl">
            <div id="hearts" class="pill">❤️❤️❤️</div>
            <div class="pill"><span class="coin"></span><b id="coins">0</b></div>
            <div class="pill score">SCORE <b id="score">0</b></div>
        </div>
        <div class="hud-top">
            <div class="trip">
                <span class="trip-from">🚗</span>
                <div class="trip-bar"><div id="tripFill"></div><div id="tripCar">🚙</div></div>
                <span class="trip-to">🏡</span>
            </div>
            <div id="tripLabel">BUBBE'S HOUSE · 3.0 mi</div>
        </div>
        <div class="hud-tr">
            <button id="pauseBtn" class="round-btn" aria-label="Pause">❚❚</button>
        </div>
        <div class="hud-br">
            <div class="speedo">
                <div id="mph">0</div><div class="unit">MPH</div>
                <div class="boost"><div id="boostFill"></div></div>
                <div class="boost-label">NITRO <span id="boostKey"></span></div>
            </div>
        </div>
        <div id="toasts"></div>
        <div id="banner" class="hidden"></div>
        <div id="padHint" class="hidden"></div>
        <div id="flash"></div>
    </div>

    <!-- ── touch controls (phones / tablets) ───────────────── -->
    <div id="touch" class="hidden">
        <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div><span>STEER</span></div>
        <div class="pedals">
            <button id="tBoost" class="tbtn small">🔥<small>NITRO</small></button>
            <button id="tHonk" class="tbtn small">📣<small>HONK</small></button>
            <button id="tCam" class="tbtn small">🎥<small>CAM</small></button>
            <button id="tBrake" class="tbtn pedal brake">BRAKE</button>
            <button id="tGas" class="tbtn pedal gas">GAS</button>
        </div>
        <div id="footPad">
            <button id="tRoll" class="tbtn">🤸<small>ROLL</small></button>
            <button id="tJump" class="tbtn">⤴<small>JUMP</small></button>
        </div>
    </div>

    <!-- ── screens ──────────────────────────────────────────── -->
    <div id="screen" class="screen">
        <div class="card" id="screenCard"></div>
    </div>

    <div id="loading" class="screen">
        <div class="card loading-card">
            <div class="logo"><span class="l1">LULU'S</span><span class="l2">ROAD TRIP</span><span class="l3">2.0</span></div>
            <div class="loadbar"><div id="loadFill"></div></div>
            <div id="loadText">Warming up the engine…</div>
        </div>
    </div>

    <!-- The iOS app: never a silent screen. If the game hasn't reached its first screen 25 s after launch, a plain panel
         says what failed (the last errors), which app + game copy this is, and offers "Use the built-in copy" (resets
         the over-the-air updater: features/native/ota.js) / "Try again" / "Keep waiting". Plain ES5, no imports — it
         works even when the game's own code can't load. Only inside the app (window.Capacitor is injected before any
         page script). IOS_BUILD.md › If the app doesn't start. -->
    <script>
    (function () {
        var cap = window.Capacitor;
        try { if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return; } catch (e) { return; }
        var errs = [], box = null, timer = null;
        function note(m) { m = String(m || "").slice(0, 300); if (m && errs.indexOf(m) < 0) { errs.push(m); if (errs.length > 6) errs.shift(); } }
        window.addEventListener("error", function (e) {
            var t = e && e.target;
            if (t && t !== window && (t.src || t.href)) note("couldn't load " + String(t.src || t.href).replace(/^[a-z]+:\/\/[^\/]+/, ""));
            else note((e && e.message || "error") + (e && e.filename ? " (" + String(e.filename).split("/").slice(-2).join("/") + ":" + e.lineno + ")" : ""));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { var r = e && e.reason; note("unhandled: " + (r && (r.message || r))); });
        function up() { try { return !!(window.__lulu3d && window.__lulu3d.state); } catch (e) { return false; } }
        var P = cap.Plugins || {}, U = P.CapacitorUpdater, App = P.App;
        function btn(id, label, main) { return '<button id="' + id + '" style="font:600 16px system-ui,sans-serif;border:0;border-radius:12px;padding:12px 16px;' + (main ? "background:#E91E63;color:#fff" : "background:#ececf2;color:#1a1a2e") + '">' + label + '</button>'; }
        function show() {
            if (up() || box) return;
            var lt = document.getElementById("loadText");
            if (lt && lt.textContent) note("loading screen: " + lt.textContent);
            box = document.createElement("div");
            box.id = "nativeStuck";
            box.setAttribute("style", "position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;background:rgba(26,26,46,.92);padding:20px;font:16px/1.4 -apple-system,system-ui,sans-serif");
            box.innerHTML = '<div style="max-width:520px;background:#fff;color:#1a1a2e;border-radius:16px;padding:20px">' +
                '<h2 style="margin:0 0 8px;color:#E91E63">The game didn\'t start</h2>' +
                '<p style="margin:0 0 8px">Something went wrong while it was loading. What we know:</p>' +
                '<pre id="nsErr" style="white-space:pre-wrap;word-break:break-word;font:12px/1.35 ui-monospace,Menlo,monospace;background:#f3f3f6;border-radius:8px;padding:8px;max-height:30vh;overflow:auto;margin:0"></pre>' +
                '<p id="nsVer" style="font-size:13px;color:#555;margin:8px 0 12px"></p>' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap">' + btn("nsBuilt", "Use the built-in copy", true) + btn("nsRetry", "Try again") + btn("nsWait", "Keep waiting") + '</div></div>';
            document.body.appendChild(box);
            document.getElementById("nsErr").textContent = errs.length ? errs.join("\n") : "No error was reported — it's just taking very long.";
            var ver = { app: "", copy: "" };
            function paintVer() { document.getElementById("nsVer").textContent = [ver.app, ver.copy].filter(Boolean).join(" · "); }
            var built = document.getElementById("nsBuilt"), cur = null;
            built.style.display = "none";
            try { if (App && App.getInfo) App.getInfo().then(function (i) { ver.app = "App " + i.version + " (build " + i.build + ")"; paintVer(); }); } catch (e) { /* no info */ }
            try {
                if (U && U.current) U.current().then(function (c) {
                    cur = c && c.bundle;
                    var builtin = !cur || cur.id === "builtin";
                    ver.copy = builtin ? "game copy: built into the app" : "game copy: " + cur.version + " (downloaded)";
                    built.style.display = builtin ? "none" : "";
                    paintVer();
                });
            } catch (e) { /* no updater */ }
            built.onclick = function () {
                // never try this copy again (ota.js reads luluOtaV1), then back to the copy inside the app
                try {
                    var S = JSON.parse(localStorage.getItem("luluOtaV1") || "{}");
                    S.bad = S.bad || []; if (cur && cur.version && S.bad.indexOf(cur.version) < 0) S.bad.push(cur.version);
                    S.pending = null; S.trying = null;
                    (S.log = S.log || []).push(new Date().toISOString().slice(0, 19) + " the player chose the built-in copy (" + (cur && cur.version) + " didn't start)");
                    localStorage.setItem("luluOtaV1", JSON.stringify(S));
                } catch (e) { /* storage full: reset anyway */ }
                try { U.reset({ toLastSuccessful: false }); } catch (e) { location.reload(); }
            };
            document.getElementById("nsRetry").onclick = function () { location.reload(); };
            document.getElementById("nsWait").onclick = function () { if (box) box.remove(); box = null; timer = setTimeout(show, 30000); };
        }
        window.__lulu3dStuck = show;                       // the old-browser check below hands over to this in the app
        var q = /[?&]test\b/.test(location.search) ? /[?&]stuck=(\d+)/.exec(location.search) : null;
        if (!/[?&]test\b/.test(location.search) || q) timer = setTimeout(show, q ? +q[1] : 25000);   // (tests: only with &stuck=ms)
        var poll = setInterval(function () { if (up()) { clearTimeout(timer); clearInterval(poll); if (box) { box.remove(); box = null; } } }, 1000);
    })();
    </script>
    <noscript><p style="padding:2em;font:18px sans-serif">Lulu's Road Trip 3D needs JavaScript.</p></noscript>
    <!-- Old / console browsers (e.g. the PS5's built-in one) may have no WebGL, no ES
         modules or no import maps: explain and point to the 2D game instead of
         sitting on the loading screen forever. Plain ES5 on purpose. (../classic.html, not
         ../ — the site root and the iOS app's index.html both forward straight back here.) -->
    <script>
    (function () {
        var ua = navigator.userAgent || "";
        var ps = /PlayStation/i.test(ua);
        window.__lulu3dFallback = function (why) {
            if (window.__lulu3dStuck) { window.__lulu3dStuck(why); return; }     // the iOS app: its own panel (above)
            var box = document.getElementById("loading");
            if (!box || box.getAttribute("data-fallback")) return;
            box.setAttribute("data-fallback", why);
            box.className = "screen";
            var msg = why === "webgl"
                ? (ps ? "The PlayStation's built-in browser can't show 3D graphics (no WebGL)." : "This browser can't show 3D graphics (WebGL is off or missing).")
                : (ps ? "The PlayStation's built-in browser is too old for the 3D version." : "This browser is too old to run the 3D version.");
            box.innerHTML = '<div class="card loading-card">' +
                '<div class="logo"><span class="l1">LULU\'S</span><span class="l2">ROAD TRIP</span><span class="l3">2.0</span></div>' +
                '<p><b>' + msg + '</b></p>' +
                '<p>' + (ps ? "Play the 2D game here, or play the 3D version on a computer, phone or tablet — your PS5 controller works there too (pair it by Bluetooth)." :
                    "Try the latest Chrome, Edge, Safari or Firefox, or turn on hardware acceleration — or play the 2D game.") + '</p>' +
                '<div class="menu"><a class="btn pink focus" id="fallback2d" href="../classic.html">▶ Play the 2D game</a></div></div>';
            var a = document.getElementById("fallback2d");
            if (a && a.focus) a.focus();
            document.addEventListener("keydown", function (e) { if (e.keyCode === 13) location.href = "../classic.html"; });
        };
        var modules = "noModule" in document.createElement("script");
        var importMaps = window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports("importmap");
        if (!modules || !importMaps) {
            document.addEventListener("DOMContentLoaded", function () { window.__lulu3dFallback("old"); });
        } else {
            // the module bootstrap sets __lulu3dBooted as soon as it runs
            setTimeout(function () { if (!window.__lulu3dBooted) window.__lulu3dFallback("old"); }, 20000);
        }
    })();
    </script>
    <!-- (copy C: the game code is deliberately not loaded) -->
</body>
</html>
